name: Project Tests

on:
  pull_request:
    branches: [develop]
  push:
    branches: [master, develop]

jobs:
  test-feature:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.0

      - name: Test OpenAI-compatible API contract
        run: python3 scripts/test_openai_compatible_contract.py

      - name: Test OpenAI OAuth API contract
        run: python3 scripts/test_openai_oauth_contract.py

      - name: Set up JDK 17
        uses: actions/setup-java@v3.13.0
        with:
          distribution: "adopt"
          java-version: "17"

      - name: Grant execute permissions for gradlew
        run: chmod +x ./gradlew

      - name: Run Tests with Gradle
        run: ./gradlew clean testDebugUnitTest
